# Docker Compose for TraceX-AI on Coolify VPS
# Frontend only — backend services + postgres run on LightningAI
#
# Usage: docker compose up -d
#
# IMPORTANT: Set NEXT_PUBLIC_API_BASE_URL to your LightningAI public URL.
#   If LightningAI URL changes, rebuild with:
#     NEXT_PUBLIC_API_BASE_URL=https://YOUR-LIGHTNINGAI-URL/api/v1 \
#       docker compose build frontend && docker compose up -d
#
# Traffic flow:
#   Browser → tracex-ai.smartnovi.tech (VPS/frontend)
#           → YOUR-LIGHTNINGAI-URL/api/v1 (browser fetches directly)

services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-https://8000-placeholder.cloudspaces.litng.ai/api/v1}
    container_name: mcpt-frontend
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-https://8000-placeholder.cloudspaces.litng.ai/api/v1}
      - COOLIFY_DEPLOYMENT=true
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.TraceX-frontend-https.rule=Host(`tracex-ai.smartnovi.tech`)
      - traefik.http.routers.TraceX-frontend-https.entrypoints=https
      - traefik.http.routers.TraceX-frontend-https.tls=true
      - traefik.http.routers.TraceX-frontend-https.tls.certresolver=letsencrypt
      - traefik.http.services.TraceX-frontend.loadbalancer.server.port=3000
      - traefik.http.routers.TraceX-frontend-http.rule=Host(`tracex-ai.smartnovi.tech`)
      - traefik.http.routers.TraceX-frontend-http.entrypoints=http
      - traefik.http.middlewares.tracex-frontend-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.tracex-frontend-redirect.redirectscheme.permanent=true
      - traefik.http.routers.TraceX-frontend-http.middlewares=tracex-frontend-redirect@docker
    networks:
      - coolify

networks:
  coolify:
    external: true
