# Docker Compose — LightningAI Backend Deployment
# Chạy: postgres + metadata-service + query-service + trace-service
#
# Frontend KHÔNG chạy ở đây — frontend chạy riêng trên VPS (Coolify).
# Xem docker-compose.yml (root) cho VPS frontend.
#
# ─── Traffic flow ────────────────────────────────────────────────────────────
#   Browser
#     → VPS: tracex-ai.smartnovi.tech        (frontend, port 443 HTTPS)
#     → LightningAI: 8002-XXXX.cloudspaces.litng.ai/api/v1  (metadata-service / all browser APIs)
#
# ─── Internal service communication ──────────────────────────────────────────
#   metadata-service  →  query-service (http://query-service:8003)
#   metadata-service  →  trace-service (http://trace-service:8004)
#   query-service     →  trace-service (http://trace-service:8004)
#   *-service         →  postgres      (postgres:5432)
#
# ─── Ports exposed trên LightningAI ──────────────────────────────────────────
#   8002  →  metadata-service  (NEXT_PUBLIC_API_BASE_URL trỏ đến port này)
#   8003  →  query-service     (internal, metadata-service gọi nội bộ)
#   8004  →  trace-service     (internal, metadata/query-service gọi nội bộ)
#   5432  →  postgres          (KHÔNG expose — chỉ dùng nội bộ Docker network)
#
# ─── Yêu cầu trước khi chạy ──────────────────────────────────────────────────
#   1. Tạo file .env.lightningai từ .env.lightningai.example
#   2. Đảm bảo /workspace/storage/ tồn tại (mkdir -p /workspace/storage)
#   3. Đảm bảo /workspace/models/ có model weights (chạy scripts/download_models.py nếu cần)
#   4. NVIDIA Container Toolkit phải được cài đặt (có sẵn trên LightningAI)
#
# ─── Usage ───────────────────────────────────────────────────────────────────
#   docker compose -f docker-compose.lightningai.yml --env-file .env.lightningai up -d

services:

  # ──────────────────────────────────────────────────────────────────────────
  # postgres-init — repairs missing PGDATA subdirs before postgres starts.
  # Necessary because bind-mount + abrupt container kill corrupts the layout.
  # ──────────────────────────────────────────────────────────────────────────
  postgres-init:
    image: postgres:16
    container_name: tracex-postgres-init
    user: root
    volumes:
      - ./storage/pgdata:/var/lib/postgresql/data
    entrypoint: >
      bash -c "
        set -e
        cd /var/lib/postgresql/data
        if [ ! -f PG_VERSION ]; then
          echo 'pgdata is empty — skip repair, postgres will initdb fresh.'
          chown -R postgres:postgres /var/lib/postgresql/data
          exit 0
        fi
        # Stale lock from an abrupt previous shutdown. Safe to remove because
        # postgres-init only runs before the postgres container.
        rm -f postmaster.pid
        for d in pg_notify pg_tblspc pg_replslot pg_stat pg_stat_tmp pg_snapshots pg_commit_ts pg_twophase pg_logical/snapshots pg_logical/mappings; do
          mkdir -p \$$d
        done
        chown -R postgres:postgres /var/lib/postgresql/data
        echo 'pgdata repaired.'
      "
    restart: "no"
    networks:
      - tracex-backend

  # ──────────────────────────────────────────────────────────────────────────
  # postgres — database nội bộ, KHÔNG expose ra ngoài
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tracex-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mcpt}
      - POSTGRES_USER=${POSTGRES_USER:-mcpt_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./storage/pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - tracex-backend
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  # ──────────────────────────────────────────────────────────────────────────
  # metadata-service — port 8002 (LightningAI cloudspace exposes 8002)
  # GPU models: Grounding DINO 1.6 + EVA-02 ViT-L/14 + SigLIP 2 + VideoMAE V2
  # ──────────────────────────────────────────────────────────────────────────
  metadata-service:
    build:
      context: .
      dockerfile: backend/services/metadata-service/Dockerfile
    container_name: tracex-metadata-service
    image: tracex/metadata-service:latest
    ports:
      - "8002:8002"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-mcpt}
      - POSTGRES_USER=${POSTGRES_USER:-mcpt_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-admin@tracex.example.com}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-Admin@123456}
      - BOOTSTRAP_ADMIN_FULL_NAME=${BOOTSTRAP_ADMIN_FULL_NAME:-Administrator}
      # Internal service URLs — dùng Docker service name
      - QUERY_SERVICE_URL=http://query-service:8003
      - TRACE_SERVICE_URL=http://trace-service:8004
      # Storage paths (bind mount vào /workspace/storage)
      - VIDEO_STORAGE_ROOT=/workspace/storage/videos
      - TRACKING_OUTPUT_ROOT=/workspace/storage/tracking-output
      - QUEUE_LOCAL_ROOT=/workspace/storage/queue
      - STORAGE_INGEST_ENABLED=${STORAGE_INGEST_ENABLED:-false}
      - STORAGE_INGEST_ROOT=/workspace/storage
      - STARTUP_LOCAL_QUEUE_SYNC_ENABLED=false
      - LOCAL_QUEUE_CACHE_ENABLED=false
      # Google Drive (tùy chọn)
      - GOOGLE_DRIVE_ENABLED=${GOOGLE_DRIVE_ENABLED:-false}
      - MCPT_SECRETS_ROOT=/workspace/secrets
      # Tracking timeouts
      - TRACKING_REQUEST_TIMEOUT_SECONDS=${TRACKING_REQUEST_TIMEOUT_SECONDS:-600}
      - TRACKING_HEALTH_TIMEOUT_SECONDS=${TRACKING_HEALTH_TIMEOUT_SECONDS:-10}
      - TRACKING_STARTUP_MAX_WAIT_SECONDS=${TRACKING_STARTUP_MAX_WAIT_SECONDS:-120}
      - TRACKING_STARTUP_POLL_INTERVAL_SECONDS=${TRACKING_STARTUP_POLL_INTERVAL_SECONDS:-10}
      - TRACKING_STARTUP_RETRY_ATTEMPTS=${TRACKING_STARTUP_RETRY_ATTEMPTS:-3}
      # AI model cache (bind mount vào /workspace/models)
      - HF_HOME=/workspace/models/huggingface
      - TORCH_HOME=/workspace/models/torch
      - TRANSFORMERS_OFFLINE=0
      - HF_TOKEN=${HF_TOKEN:-}
      # O1 — RT-DETR profiling. Set to 1 to log per-stage timing
      # (preprocess wait / H2D / forward / post-process) at the end of each video.
      - RTDETR_PROFILE=${RTDETR_PROFILE:-1}
      # O3b — GPU-side preprocessing (resize + rescale on GPU instead of HF
      # processor on CPU). Cuts preprocess_wait from ~36ms/frame to ~3ms.
      # Bit-equality verified on synthetic + structured frames (max diff 0.003
      # in fp16). Set to 0 to fall back to legacy CPU path if needed.
      - RTDETR_GPU_PREPROCESS=${RTDETR_GPU_PREPROCESS:-1}
      # Pipeline frame-sampling rate. BoT-SORT uses Kalman + IoU, so
      # default to 6 FPS for smaller inter-frame motion while keeping the
      # value tunable per run.
      - PIPELINE_SAMPLE_FPS=${PIPELINE_SAMPLE_FPS:-6}
      # Tracker backend: botsort (default) | adaptive (legacy BodyPartAdaptiveTracker)
      - TRACER_BACKEND=${TRACER_BACKEND:-botsort}
      # FragmentMerger tuning (2026-05-17 PersonViT-S + real-CCTV calibration):
      #   SIM_THRESHOLD     0.75  — PersonViT-S cosine sweet spot (camera_0002 bench)
      #   MAX_GAP_SECONDS   120   — allow re-entry after long occlusion (was 30)
      #   MAX_SPEED_PX_PER_S 800  — fits 1080p fast-walking (was 300, too tight)
      #   MAX_SPATIAL_DIST_PX 1500 — allow opposite-FOV-edge re-entry (was 400)
      - FRAGMENT_MERGE_SIM_THRESHOLD=${FRAGMENT_MERGE_SIM_THRESHOLD:-0.80}
      - FRAGMENT_MERGE_MAX_GAP_SECONDS=${FRAGMENT_MERGE_MAX_GAP_SECONDS:-120}
      - FRAGMENT_MERGE_MAX_SPEED_PX_PER_S=${FRAGMENT_MERGE_MAX_SPEED_PX_PER_S:-800}
      - FRAGMENT_MERGE_MAX_SPATIAL_DIST_PX=${FRAGMENT_MERGE_MAX_SPATIAL_DIST_PX:-1500}
      - QWEN25VL_MODEL_ID=${QWEN25VL_MODEL_ID:-}
      - VLM_BATCH_SIZE=${VLM_BATCH_SIZE:-4}
      - VLM_BATCH_MAX_SIZE=${VLM_BATCH_MAX_SIZE:-8}
      - VLM_BATCH_MAX_NEW_TOKENS_PER_CROP=${VLM_BATCH_MAX_NEW_TOKENS_PER_CROP:-512}
      # LightningAI public URL (để tạo download links)
      - NEXT_PUBLIC_API_GATEWAY_URL=${LIGHTNINGAI_PUBLIC_URL:-}
      - A20_ROOT=${A20_ROOT:-/workspace/a20-root}
    volumes:
      - ./storage:/workspace/storage
      - /home/zeus/.cache/huggingface:/workspace/models/huggingface
      - ./storage/model-weights:/workspace/models/weights
      - /home/zeus/.cache/torch:/workspace/models/torch
      - ./secrets:/workspace/secrets:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=20).read()"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - tracex-backend
    depends_on:
      postgres:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────────────────────
  # query-service — port 8003
  # GPU models: SeamlessM4T + RT-DETR + PersonViT + SigLIP
  # ──────────────────────────────────────────────────────────────────────────
  query-service:
    build:
      context: .
      dockerfile: backend/services/query-service/Dockerfile
    container_name: tracex-query-service
    image: tracex/query-service:latest
    ports:
      - "8003:8003"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-mcpt}
      - POSTGRES_USER=${POSTGRES_USER:-mcpt_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      # Internal service URLs
      - TRACE_SERVICE_URL=http://trace-service:8004
      - METADATA_SERVICE_URL=http://metadata-service:8002
      # Translation model
      - SEAMLESS_MODEL=${SEAMLESS_MODEL:-facebook/seamless-m4t-v2-large}
      - TRANSLATION_MODEL_PATH=/workspace/models/seamless-m4t
      # Storage
      - PREVIEW_ROOT=/workspace/storage/candidate-previews
      - PUBLIC_API_BASE_URL=${LIGHTNINGAI_PUBLIC_URL:-}
      # Search tuning
      - MIN_FUSION_SCORE=${MIN_FUSION_SCORE:-0.5}
      - MAX_CANDIDATES=${MAX_CANDIDATES:-50}
      # 2026-05-17: ReID lane uses PersonViT-S MSMT17 (384-dim). Ingest-side
      # FRAGMENT_MERGE_SIM_THRESHOLD is 0.80 (loose-gate sweet spot from
      # camera_0002 bench). Query-side is slightly stricter (0.82) because
      # cross-video grouping spans larger temporal/spatial windows than within-
      # video fragment merge — appearance evidence must be stronger to commit.
      # QUERY_REID_MERGE_THRESHOLD overrides this if set.
      - QUERY_MERGE_THRESHOLD=${QUERY_MERGE_THRESHOLD:-0.82}
      # AI model cache
      - HF_HOME=/workspace/models/huggingface
      - TORCH_HOME=/workspace/models/torch
      - HUGGINGFACE_HUB_CACHE=/workspace/models/huggingface/hub
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    volumes:
      - ./storage:/workspace/storage
      - /home/zeus/.cache/huggingface:/workspace/models/huggingface
      - ./storage/model-weights:/workspace/models/weights
      - /home/zeus/.cache/torch:/workspace/models/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - tracex-backend
    depends_on:
      postgres:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────────────────────
  # trace-service — port 8004
  # GPU models: Real-ESRGAN + ProPainter + RIFE + NVENC
  # ──────────────────────────────────────────────────────────────────────────
  trace-service:
    build:
      context: .
      dockerfile: backend/services/trace-service/Dockerfile
    container_name: tracex-trace-service
    image: tracex/trace-service:latest
    ports:
      - "8004:8004"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-mcpt}
      - POSTGRES_USER=${POSTGRES_USER:-mcpt_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
      # Storage
      - VIDEO_STORAGE_PATH=/workspace/storage/videos
      - TRACE_OUTPUT_PATH=/workspace/storage/traces
      - TRACE_CACHE_ROOT=/workspace/storage/cache
      - STORAGE_BASE_URL=${STORAGE_BASE_URL:-https://tracex-ai.smartnovi.tech/storage}
      # Trace settings
      - MAX_TRACE_WINDOW_HOURS=${MAX_TRACE_WINDOW_HOURS:-168}
      - DEFAULT_TRACE_WINDOW_HOURS=${DEFAULT_TRACE_WINDOW_HOURS:-24}
      - VIDEO_MERGE_ENABLED=${VIDEO_MERGE_ENABLED:-true}
      - MAX_SEGMENTS_PER_TRACE=${MAX_SEGMENTS_PER_TRACE:-50}
      - MCPT_SECRETS_ROOT=${MCPT_SECRETS_ROOT:-/workspace/secrets}
      - DRIVE_CACHE_MAX_BYTES=${DRIVE_CACHE_MAX_BYTES:-21474836480}
      # Trace clip rendering is CPU/IO bound. Keep this conservative so
      # metadata embedding and query ranking can continue in parallel.
      - TRACE_CLIP_PARALLEL_WORKERS=${TRACE_CLIP_PARALLEL_WORKERS:-2}
      - TRACE_CLIP_FFMPEG_THREADS=${TRACE_CLIP_FFMPEG_THREADS:-2}
      - TRACE_CLIP_VALIDATE_TIMEOUT_SECONDS=${TRACE_CLIP_VALIDATE_TIMEOUT_SECONDS:-0}
      # AI model cache
      - HF_HOME=/workspace/models/huggingface
      - TORCH_HOME=/workspace/models/torch
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    volumes:
      - ./storage:/workspace/storage
      - /home/zeus/.cache/huggingface:/workspace/models/huggingface
      - /home/zeus/.cache/torch:/workspace/models/torch
      - ./secrets:/workspace/secrets:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - tracex-backend
    depends_on:
      postgres:
        condition: service_healthy

# ────────────────────────────────────────────────────────────────────────────
# Volumes
# ────────────────────────────────────────────────────────────────────────────
# postgres_data đã chuyển sang bind mount /workspace/storage/pgdata
# để persist qua LightningAI machine restart

# ────────────────────────────────────────────────────────────────────────────
# Networks
# ────────────────────────────────────────────────────────────────────────────
networks:
  tracex-backend:
    driver: bridge
